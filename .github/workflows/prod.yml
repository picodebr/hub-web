name: Deploy - PROD

on:
  push:
    branches:
      - master

jobs:
  BuildAndPushImageToECR:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository source
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build \
          --build-arg NEXT_PUBLIC_API_ADDRESS=${{ secrets.NEXT_PUBLIC_API_ADDRESS }} \
          --build-arg NEXT_PUBLIC_RECAPTCHA_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_KEY }} \
          --build-arg NEXT_PUBLIC_RECAPTCHA_API_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_API_KEY }} \
          --build-arg NEXT_PUBLIC_PHYSICAL_SIMULATOR_URL=${{ secrets.NEXT_PUBLIC_PHYSICAL_SIMULATOR_URL }} \
          --build-arg NEXT_PUBLIC_COMPILER_API_KEY=${{ secrets.NEXT_PUBLIC_COMPILER_API_KEY }} \
          --build-arg NEXT_PUBLIC_COMPILER_API_URL=${{ secrets.NEXT_PUBLIC_COMPILER_API_URL }} \
          --tag hub-web-prod .

      - name: Push to ECR
        uses: jwalton/gh-ecr-push@v1
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: us-east-1
          image: hub-web-prod
